# The web version (web/, scripts/build-web.sh) on GitHub Pages, rebuilt on every push to main that touches it.
# Pages cannot send the COOP/COEP headers the WebAssembly threads need: web/site/coi-serviceworker.js adds them
# (the first visit reloads once).
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'native/**'
      - 'third_party/**'
      - 'scripts/build-web.sh'
      - 'shell.nix'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # devourer only: its own submodules are vendor driver trees the build does not use
      - name: Submodules
        run: |
          git submodule update --init third_party/libusb third_party/wifi-sdr
          git -C third_party/wifi-sdr submodule update --init external/devourer

      - uses: cachix/install-nix-action@v31

      # the web shell: emscripten, Node, cmake, mipsel binutils (no Android SDK/NDK)
      - name: Build
        run: nix-shell --arg web true --run scripts/build-web.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
